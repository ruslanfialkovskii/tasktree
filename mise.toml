[tools]
python = "3.13"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Install dependencies"
run = "uv pip install -e '.[dev]'"

[tasks.test]
description = "Run all tests (alias for test:full)"
run = "pytest tests/ -v"

[tasks."test:quick"]
description = "Run quick unit tests (for commits)"
run = "pytest tests/test_config.py tests/test_task_manager.py -v --tb=short"

[tasks."test:full"]
description = "Run all tests (for PRs)"
run = "pytest tests/ -v"

[tasks."test:memory"]
description = "Run memory tests only"
run = "pytest tests/test_memory.py -v"

[tasks."test:ui"]
description = "Run UI/integration tests"
run = "pytest tests/test_app.py tests/test_modals.py tests/test_setup_modal.py tests/test_status_panel.py -v"

[tasks."test:watch"]
description = "Run tests in watch mode"
run = "pytest tests/ -v --tb=short -x"

[tasks."test:cov"]
description = "Run tests with coverage"
run = "pytest tests/ -v --cov=tasktree_manager --cov-report=term-missing"

[tasks.lint]
description = "Run linter"
run = "ruff check tasktree_manager/ tests/"

[tasks."lint:fix"]
description = "Run linter and fix issues"
run = "ruff check --fix tasktree_manager/ tests/"

[tasks.format]
description = "Format code"
run = "ruff format tasktree_manager/ tests/"

[tasks.build]
description = "Build package"
run = "python -m build"

[tasks.clean]
description = "Clean build artifacts"
run = """
rm -rf dist/ build/ *.egg-info/
find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
find . -type d -name .pytest_cache -exec rm -rf {} + 2>/dev/null || true
"""

[tasks.run]
description = "Run tasktree-manager"
run = "tasktree-manager"

[tasks.dev]
description = "Run tasktree-manager in dev mode with textual console"
run = "textual run --dev tasktree_manager.app:TaskTreeApp"

[tasks."release:check"]
description = "Dry-run to preview what a patch release would do"
run = "python scripts/bump_version.py patch --dry-run"

# Releases are cut by the Release workflow (tests gate the tag). Bumping
# pyproject locally desyncs it from the latest tag and makes the workflow
# skip or double-bump, so these tasks dispatch the workflow instead.
[tasks."release:patch"]
description = "Trigger a patch release via GitHub Actions"
run = "gh workflow run release.yml -f release_type=patch"

[tasks."release:minor"]
description = "Trigger a minor release via GitHub Actions"
run = "gh workflow run release.yml -f release_type=minor"

[tasks."release:major"]
description = "Trigger a major release via GitHub Actions"
run = "gh workflow run release.yml -f release_type=major"
