# tasktree-manager Release Workflow
#
# Multi-job release pipeline with manual trigger support.
# Handles version bumping, testing, building, PyPI publishing,
# and GitHub release creation.
#
# Order matters: the version is only *computed* up front; lint and the full
# test matrix run against the pushed commit, and only when they pass is the
# bump committed, tagged and pushed. A red release run therefore never
# leaves a ghost tag or a bumped pyproject on main.
#
# Triggers:
#   - Push to main: semantic-release determines if a release is needed
#   - Manual dispatch: choose release type, pre-release, and draft options.
#     Both `draft` and `pre_release` skip the PyPI upload (the pipeline can
#     only produce final X.Y.Z versions) and only shape the GitHub release.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Type of release"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      pre_release:
        description: "Mark the GitHub release as pre-release? (skips PyPI)"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create the GitHub release as a draft? (skips PyPI)"
        required: false
        default: false
        type: boolean

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.determine_version.outputs.new_version }}
      released: ${{ steps.determine_version.outputs.released }}
      current_version: ${{ steps.determine_version.outputs.current_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Pinned: an unpinned resolver pull once produced a PSR/GitPython
        # combination that crashed on startup
        run: pip install "python-semantic-release==10.6.2"

      - name: Determine version
        id: determine_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The latest v* tag is the source of truth for the current version
          # (semantic-release derives the next one from it). pyproject is
          # only reported: a stray local bump must not shift the release.
          latest_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "v0.0.0")
          current_version="${latest_tag#v}"
          echo "current_version=${current_version}" >> $GITHUB_OUTPUT
          echo "Current version (latest tag): ${current_version}"

          release_type="${{ inputs.release_type || 'auto' }}"

          if [ "$release_type" = "auto" ]; then
            # Use semantic-release to determine the next version from the
            # commit history. When no qualifying commits exist it prints the
            # CURRENT version — require an actual bump before releasing.
            # A tool crash is an error, never "no release needed".
            if ! VERSION=$(semantic-release version --print); then
              echo "::error::semantic-release failed to compute the next version"
              exit 1
            fi
            if [ -n "$VERSION" ] && [ "$VERSION" != "$current_version" ]; then
              new_version="$VERSION"
              echo "new_version=${new_version}" >> $GITHUB_OUTPUT
              echo "released=true" >> $GITHUB_OUTPUT
              echo "Auto-detected next version: ${new_version}"
            else
              echo "released=false" >> $GITHUB_OUTPUT
              echo "No release needed (no qualifying commits)"
            fi
          else
            # Manual bump computed from the latest tag
            IFS='.' read -r major minor patch <<< "$current_version"
            case "$release_type" in
              major) new_version="$((major + 1)).0.0" ;;
              minor) new_version="${major}.$((minor + 1)).0" ;;
              patch) new_version="${major}.${minor}.$((patch + 1))" ;;
              *) echo "::error::unknown release type ${release_type}"; exit 1 ;;
            esac
            echo "new_version=${new_version}" >> $GITHUB_OUTPUT
            echo "released=true" >> $GITHUB_OUTPUT
            echo "Manual bump to: ${new_version}"
          fi

  lint:
    name: Lint
    needs: prepare-release
    if: needs.prepare-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check tasktree_manager tests

      - name: Run ruff formatter check
        run: ruff format --check tasktree_manager tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: prepare-release
    if: needs.prepare-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same matrix as ci.yml: the release gate must not be weaker than CI
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Configure git for tests
        run: |
          git config --global user.email "test@test.com"
          git config --global user.name "Test User"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  tag-release:
    name: Commit and Tag
    needs: [prepare-release, lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The exact commit that was tested. Pushing HEAD:main below fails
          # (non-fast-forward) if main moved in the meantime, instead of
          # tagging code the gate never saw.
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply version bump
        # Write the exact version semantic-release computed; deriving it
        # again from pyproject would drift whenever pyproject and the tag
        # disagree (phantom or skipped releases)
        run: python scripts/bump_version.py --set "${{ needs.prepare-release.outputs.new_version }}"

      - name: Commit and tag version
        run: |
          new_version="${{ needs.prepare-release.outputs.new_version }}"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore(release): ${new_version} [skip ci]"
          git tag -a "v${new_version}" -m "Release v${new_version}"
          git push origin HEAD:main
          git push origin "v${new_version}"

  build:
    name: Build Package
    needs: [prepare-release, tag-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: "v${{ needs.prepare-release.outputs.new_version }}"
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build hatch-vcs twine

      - name: Build package
        run: python -m build

      - name: Validate with twine
        run: twine check dist/*

      - name: Test installation from wheel
        run: |
          pip install dist/*.whl
          python -c "from tasktree_manager.app import TaskTreeApp; print('Import successful')"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: [prepare-release, build]
    # Drafts and pre-releases never reach PyPI: bump_version.py only emits
    # final X.Y.Z versions, so uploading would publish a real release
    if: ${{ !inputs.draft && !inputs.pre_release }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: List packages
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: [prepare-release, build, publish-pypi]
    # Run after a successful build whether PyPI publishing ran or was
    # skipped (draft / pre-release), but never after a failed upload
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: "v${{ needs.prepare-release.outputs.new_version }}"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Build release notes
        id: release_notes
        run: |
          version="${{ needs.prepare-release.outputs.new_version }}"
          current="${{ needs.prepare-release.outputs.current_version }}"

          # Extract the section for this version from CHANGELOG.md
          changelog_content=$(awk "/## \[${version}\]/ {flag=1;next} /^## / {flag=0} flag" CHANGELOG.md || echo "")
          if [ -z "$changelog_content" ]; then
            changelog_content="Release v${version}"
          fi

          # Build full release body
          cat > release_notes.md << NOTES_EOF
          # tasktree-manager v${version}

          ${current} → ${version}

          ## Changes

          ${changelog_content}

          ## Installation

          \`\`\`bash
          pip install tasktree-manager==${version}
          \`\`\`

          Or upgrade:

          \`\`\`bash
          pip install --upgrade tasktree-manager
          \`\`\`
          NOTES_EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-release.outputs.new_version }}
          name: Release v${{ needs.prepare-release.outputs.new_version }}
          body_path: release_notes.md
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.pre_release || false }}
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
